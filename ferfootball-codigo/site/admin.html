<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>FerFootBall | Registro de cookies</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .admin { max-width: 980px; margin: 0 auto; padding: 56px var(--gutter); }
    .admin h1 { font-family: var(--font-display); font-size: var(--text-2xl); text-transform: uppercase; margin-bottom: 8px; }
    .admin > p { color: var(--text-muted); margin-bottom: 28px; }
    .admin-card { padding: 24px; border-radius: var(--radius-lg); background: var(--surface); border: 1px solid var(--line); margin-bottom: 20px; }
    .admin-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .admin-row .field { flex: 1; min-width: 220px; }
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
    .kpis div { padding: 16px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); }
    .kpis strong { display: block; font-family: var(--font-display); font-size: 2rem; }
    .kpis span { font-size: var(--text-xs); color: var(--text-faint); letter-spacing: .12em; font-weight: 700; }
    .log { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
    .log th, .log td { padding: 10px 8px; border-top: 1px solid var(--line); text-align: left; white-space: nowrap; }
    .log th { color: var(--text-faint); font-size: var(--text-xs); letter-spacing: .1em; }
    .ok { color: var(--live); } .no { color: var(--text-faint); }
    @media (max-width: 720px) { .kpis { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <main class="admin">
    <a class="brand" href="index.html"><span class="brand-mark">F<span>F</span></span><span class="brand-word">FER<span>FOOTBALL</span></span></a>
    <h1 style="margin-top:32px">Registro de cookies</h1>
    <p>Consentimientos guardados con fecha, elección y dirección IP. Descárgalos en un documento Word.</p>

    <div class="admin-card">
      <form id="keyForm" class="admin-row">
        <label class="field"><span>Clave de administrador</span><input type="password" id="key" required autocomplete="current-password"></label>
        <button class="btn ghost" type="submit">Ver registros</button>
        <button class="btn primary" type="button" id="dl">Descargar Word <b>↓</b></button>
      </form>
      <p class="form-error" id="err" role="alert" style="margin-top:12px"></p>
    </div>

    <div id="out" hidden>
      <div class="kpis">
        <div><strong id="kTotal">0</strong><span>REGISTROS</span></div>
        <div><strong id="kAcc">0</strong><span>ACEPTAN TODO</span></div>
        <div><strong id="kRej">0</strong><span>RECHAZAN</span></div>
        <div><strong id="kCus">0</strong><span>PERSONALIZADO</span></div>
      </div>
      <div class="admin-card table-wrap" style="padding:8px 16px">
        <table class="log"><thead><tr><th>FECHA</th><th>IP</th><th>ACCIÓN</th><th>PREF.</th><th>ANALÍT.</th><th>MARKET.</th></tr></thead><tbody id="rows"></tbody></table>
      </div>
    </div>
  </main>

  <script>
    window.FF_CONFIG = { consentApi: '__PORT_8000__' };
  </script>
  <script>
    (function () {
      const raw = window.FF_CONFIG.consentApi;
      const local = ['localhost', '127.0.0.1'].includes(location.hostname);
      const API = raw.startsWith('__PORT_') ? (local ? 'http://localhost:8000' : '') : raw.replace(/\/$/, '');
      const $ = (s) => document.querySelector(s);
      const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const ACT = { accept_all: 'Aceptar todas', reject_all: 'Rechazar', custom: 'Personalizado' };
      const yn = (b) => b ? '<span class="ok">Sí</span>' : '<span class="no">No</span>';
      const err = (m) => { $('#err').textContent = m || ''; };
      if (!API) err('Falta configurar la dirección del servidor (FF_CONFIG.consentApi).');

      $('#keyForm').addEventListener('submit', async (e) => {
        e.preventDefault(); err('');
        try {
          const r = await fetch(`${API}/api/consents?key=${encodeURIComponent($('#key').value)}`, { credentials: 'same-origin' });
          if (r.status === 401) return err('Clave incorrecta.');
          if (!r.ok) throw new Error();
          const list = (await r.json()).reverse();
          $('#out').hidden = false;
          $('#kTotal').textContent = list.length;
          $('#kAcc').textContent = list.filter((x) => x.action === 'accept_all').length;
          $('#kRej').textContent = list.filter((x) => x.action === 'reject_all').length;
          $('#kCus').textContent = list.filter((x) => x.action === 'custom').length;
          $('#rows').innerHTML = list.length ? list.map((x) => `<tr><td>${esc(x.date_local)}</td><td>${esc(x.ip)}</td><td>${esc(ACT[x.action] || x.action)}</td><td>${yn(x.choices.preferences)}</td><td>${yn(x.choices.analytics)}</td><td>${yn(x.choices.marketing)}</td></tr>`).join('') : '<tr><td colspan="6">Todavía no hay registros.</td></tr>';
        } catch (e2) { err('No se pudo conectar con el servidor.'); }
      });

      $('#dl').addEventListener('click', async () => {
        err('');
        const key = $('#key').value;
        if (!key) return err('Escribe la clave de administrador.');
        try {
          const r = await fetch(`${API}/api/consents.docx?key=${encodeURIComponent(key)}`, { credentials: 'same-origin' });
          if (r.status === 401) return err('Clave incorrecta.');
          if (!r.ok) throw new Error();
          const blob = await r.blob();
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `consentimientos-cookies-${new Date().toISOString().slice(0, 10)}.docx`;
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(a.href), 5000);
        } catch (e2) { err('No se pudo descargar el documento.'); }
      });
    })();
  </script>
</body>
</html>
